<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Randevu Alindi</title>
        <style>
           * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'segoe uI', Tahoma, Geneva, Vardana, sans-serif;
            } 
           body {
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20x;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 420px;
            width:100%;
        }
        .icon {
            width: 70px;
            height: 70px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
        }
        h1 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
         }
         </style>
         </head>
         <body>
            <div class="card">
                <div class="icon">✓</div>
                <h1>Randevunuz Başariyla Alindi!</h1>
                <p>Talebiniz bize ulaşmiştir. Detaylar e-posta adresinize gonderilmiştir.</p>
                <a href="/" class="btn">Ana Sayfaya Don</a>
                </div>
                </body>
                </html>
